<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GLOBAL DIET PLAN</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-diet.png">
<link class="apple-touch-icon" href="icon-diet.png">
<meta name="theme-color" content="#16a34a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    :root {
      --bg: #e0e5ec;
      --shadow-light: #ffffff;
      --shadow-dark: #a3b1c6;
      --accent: #007AFF;
      --accent-emerald: #34C759;
      --text: #31344b;
      --card-line: linear-gradient(90deg, #007AFF, #00C6FF);
      --neu-inset: inset 3px 3px 6px #a3b1c6, inset -3px -3px 6px #ffffff;
    }
    body.dark {
      --bg: #1e222b;
      --shadow-light: #2c313d;
      --shadow-dark: #101217;
      --accent: #00d2ff;
      --accent-emerald: #34C759;
      --text: #ffffff;
      --card-line: linear-gradient(90deg, #00d2ff, #3a7bd5);
      --neu-inset: inset 3px 3px 6px #101217, inset -3px -3px 6px #2c313d;
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      transition: background 0.3s ease; 
      min-height: 100vh; 
      width: 100%;
      overflow-x: hidden;
    }
    
    .container { width: 100%; max-width: 440px; margin: 0 auto; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%; gap: 10px; }
    .mode-switch { display: flex; gap: 6px; flex: 1.2; }
    .mode-btn { padding: 10px 6px; border-radius: 12px; border: none; font-weight: bold; background: var(--bg); color: var(--text); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); cursor: pointer; font-size: 11px; flex: 1; text-align: center; }
    body:not(.dark) #dBtn { background: #2d3436; color: white; }
    body.dark #lBtn { background: #ffffff; color: #2d3436; }
    .mode-btn.active { color: var(--accent); box-shadow: var(--neu-inset); }
    
    .lang-switch { flex: 0.8; }
    .lang-select { width: 100%; padding: 10px; border-radius: 12px; border: none; font-weight: bold; background: var(--bg); color: var(--text); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); cursor: pointer; font-size: 12px; outline: none; }

    .header-card {
      background: linear-gradient(135deg, #007AFF, #00C6FF);
      color: white; border-radius: 28px; padding: 35px 20px;
      margin-bottom: 30px; box-shadow: 0 12px 24px rgba(0,0,0,0.12);
      text-align: center; width: 100%; position: relative; overflow: hidden;
    }
    .header-card .top-tag { font-size: 11px; font-weight: bold; opacity: 0.8; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; }
    .header-card .main-greet { font-size: 22px; font-weight: 800; margin-bottom: 12px; line-height: 1.2; word-break: keep-all; }
    .header-card .bottom-summary { font-size: 14px; font-weight: 500; opacity: 0.95; line-height: 1.4; }

    .runner { position: absolute; bottom: 8px; font-size: 26px; pointer-events: none; width: 40px; z-index: 1; }
    .runner.left { left: -50px; animation: moveRight 14s linear infinite; }
    .runner.right { right: -50px; animation: moveLeft 14s linear infinite; animation-delay: 7s; }
    @keyframes moveRight { from { left: -50px; } to { left: 110%; } }
    @keyframes moveLeft { from { right: -50px; } to { right: 110%; } }
    .runner.left span { transform: scaleX(-1); display: inline-block; }

    .card { 
      background: var(--bg); border-radius: 24px; padding: 22px; 
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); 
      margin-bottom: 25px; position: relative; width: 100%; 
    }
    .card::before { 
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; 
      background: var(--card-line); border-radius: 24px 24px 0 0;
    }

    .section-title { 
      background: var(--accent); color: white; border-radius: 14px; padding: 12px; 
      font-weight: bold; margin-bottom: 20px; text-align: center; font-size: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .input-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; }
    .input-group { flex: 1; min-width: 100px; text-align: left; }
    @media (max-width: 380px) { .input-group { min-width: 45%; } }

    .label { font-size: 11px; margin-bottom: 6px; display: block; font-weight: bold; opacity: 0.7; padding-left: 4px; }
    
    .neu-input { 
      width: 100%; border: none; border-radius: 14px; padding: 13px; 
      background: var(--bg); color: var(--text); box-shadow: var(--neu-inset); 
      font-size: 15px; outline: none; transition: 0.2s;
    }
    #uiDate { cursor: pointer; }

    .neu-btn { 
      width: 100%; padding: 18px; border: none; border-radius: 20px; 
      background: var(--bg); color: var(--accent); font-weight: bold; 
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); 
      cursor: pointer; margin-bottom: 15px; transition: all 0.2s ease; font-size: 16px; 
    }
    .neu-btn:active { box-shadow: var(--neu-inset); transform: translateY(2px); }
    .neu-btn.active { box-shadow: var(--neu-inset); color: #ff9500; }

    .toggle-section { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .toggle-section.show { max-height: 2000px; padding: 5px 0; }

    .food-row { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 14px; border-radius: 16px; margin-bottom: 12px; 
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); 
      font-size: 14px; background: var(--bg);
    }
    .cancel-btn { 
      color: #ff5252; cursor: pointer; font-size: 11px; font-weight: bold; 
      padding: 6px 10px; border-radius: 12px; border: 1px solid #ff5252; margin-left: 10px;
    }

    .table-container { overflow-x: auto; width: 100%; border-radius: 15px; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; background: white; color: #333; }
    body.dark table { background: #3d4648; color: white; }
    th, td { padding: 12px 8px; border: 1px solid var(--shadow-dark); text-align: center; }
    th { background: rgba(0,0,0,0.04); font-weight: bold; }
    .result-text { font-size: 15px; line-height: 2.0; text-align: left; }

    /* 실시간 영양 검색 디자인 */
    .search-box-container {
      background: rgba(0,0,0,0.03); padding: 16px; border-radius: 20px; margin-bottom: 22px;
      box-shadow: var(--neu-inset); border: 1px solid rgba(255,255,255,0.1);
    }
    .search-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .search-api-tag { background: var(--accent-emerald); color: white; font-size: 10px; padding: 3px 8px; border-radius: 8px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    .search-results-list { max-height: 240px; overflow-y: auto; margin-top: 12px; padding-right: 4px; }
    
    .search-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border-radius: 14px; background: var(--bg); margin-bottom: 10px;
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    }
    .search-item-info { font-size: 13px; text-align: left; flex: 1; padding-right: 10px; }
    .search-item-cal { font-size: 12px; color: #8e8e93; margin-top: 4px; font-weight: 500; display: flex; align-items: center; gap: 3px; }
    .search-item-btns { display: flex; gap: 6px; }
    
    .sm-btn { padding: 8px 12px; font-size: 12px; border: none; border-radius: 10px; background: var(--bg); color: var(--text); box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light); cursor: pointer; font-weight: bold; }
    .sm-btn.primary { color: #ffffff; background: var(--accent-emerald); }

    /* 타임라인 로그 스타일 */
    .log-card {
      padding: 16px; border-radius: 20px; background: var(--bg); margin-bottom: 15px;
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      position: relative; text-align: left;
    }
    .log-card .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; opacity: 0.8; }
    .log-card .log-header-right { display: flex; align-items: center; gap: 8px; }
    .log-card .log-tag { background: #ff9500; color: white; padding: 4px 8px; border-radius: 8px; font-weight: bold; }
    .log-card .log-content { font-size: 14px; font-weight: bold; margin-bottom: 6px; line-height: 1.4; }
    .log-card .log-kcal { color: var(--accent); font-weight: bold; font-size: 13px; }
    
    .log-delete-icon-btn { 
      background: none; border: none; cursor: pointer; 
      color: #ff5252; padding: 4px; border-radius: 8px;
      transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
    }
    .log-delete-icon-btn:hover { background: rgba(255, 82, 82, 0.1); transform: scale(1.08); }
    .log-delete-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* 커스텀 다국어 달력 디자인 */
    .custom-cal-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); z-index: 2000; justify-content: center; align-items: center; padding: 20px;
    }
    .cal-box {
      background: var(--bg); border-radius: 24px; padding: 22px; width: 100%; max-width: 340px;
      box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
    }
    .cal-nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .cal-title-text { font-size: 18px; font-weight: 800; cursor: pointer; }
    .cal-arrows { display: flex; gap: 15px; }
    .cal-arrow-btn { font-size: 20px; cursor: pointer; user-select: none; font-weight: bold; }
    
    .cal-week-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 13px; margin-bottom: 10px; opacity: 0.8; }
    .cal-days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    
    .cal-day-cell {
      padding: 10px 0; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer;
      box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light); transition: 0.1s;
    }
    .cal-day-cell.other-month { opacity: 0.3; box-shadow: none; }
    .cal-day-cell.today-active { box-shadow: var(--neu-inset); color: var(--accent); border: 2px solid var(--accent); }
    .cal-day-cell.selected-active { background: var(--accent); color: white; box-shadow: none; }
    
    .cal-footer-btns { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 10px; border-top: 1px solid var(--shadow-dark); }
    .cal-flat-link { font-size: 15px; font-weight: bold; color: var(--accent); cursor: pointer; }
    .cal-flat-link.danger { color: #ff5252; }
    .cal-flat-link:active { opacity: 0.6; }

    .icon-sparkles::before { content: "✨ "; }
    .icon-search::before { content: "🔍 "; }
    .icon-globe::before { content: "🌐 "; }
</style>
</head>
<body>
<div class="container">
  
  <div class="top-bar">
    <div class="mode-switch">
      <button id="lBtn" class="mode-btn" onclick="changeMode('light')">기본모드 ☀️</button>
      <button id="dBtn" class="mode-btn" onclick="changeMode('dark')">다크모드 🌙</button>
    </div>
    <div class="lang-switch">
      <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="ko">🇰🇷 한국어</option>
        <option value="en">🇺🇸 English</option>
        <option value="jp">🇯🇵 日本語</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
    </div>
  </div>
  
  <div class="header-card">
    <div class="top-tag">MY DIET PLAN</div>
    <div class="runner left"><span>🏃‍♂️</span></div>
    <div class="runner right"><span>🏃‍♂️</span></div>
    <h1 class="main-greet" id="t_mainGreet">목표 달성까지 계속 함께합니다! 🍎</h1>
    <div id="hello-summary" class="bottom-summary">나의 정보를 입력해주세요.</div>
  </div>

  <div class="card" style="padding: 15px;">
    <label class="label" id="t_uiDateLabel">입력 날짜 선택</label>
    <input type="text" id="uiDate" class="neu-input" readonly onclick="openCustomCalendar()">
  </div>

  <div class="section-title" id="t_secTitle1">총대사량 산출</div>
  <div class="card">
    <div class="input-grid">
      <div class="input-group"><label class="label" id="t_lblH">키(cm)</label><input type="number" id="h" class="neu-input" placeholder="175"></div>
      <div class="input-group"><label class="label" id="t_lblW">체중(kg)</label><input type="number" id="w" class="neu-input" placeholder="75"></div>
      <div class="input-grid-group" style="display:flex; flex:1; gap:12px;">
        <div class="input-group"><label class="label" id="t_lblA">나이(세)</label><input type="number" id="a" class="neu-input" placeholder="30"></div>
      </div>
    </div>
    <div class="input-grid">
      <div class="input-group" style="flex: 2;">
        <label class="label" id="t_lblLvl">활동수준</label>
        <select id="lvl" class="neu-input"></select>
      </div>
      <div class="input-group"><label class="label" id="t_lblEx">운동시간(분)</label><input type="number" id="exMin" class="neu-input" placeholder="60"></div>
    </div>
  </div>

  <button id="tdeeBtn" class="neu-btn" onclick="toggleTDEE()">총대사량 산출 보기 📊</button>
  <div id="tdeeSec" class="toggle-section">
    <div class="card">
      <div id="tdeeRes" class="result-text">기본 정보를 입력하고 버튼을 눌러주세요.</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" id="t_secTitle2" style="background:var(--accent-emerald);">하루 섭취 칼로리</div>
    
    <div class="input-grid" style="margin-bottom: 20px;">
      <div class="input-group">
        <label class="label" id="t_lblMealTime">식사 시점 분류</label>
        <select id="mealTime" class="neu-input"></select>
      </div>
    </div>

    <!-- API 실시간 영양 검색 영역 -->
    <div class="search-box-container">
      <div class="search-header">
        <span class="search-api-tag" id="t_apiTag"><span class="icon-globe"></span>API 웰니스 데이터베이스 검색 및 즉시 입력</span>
        <span style="font-size:12px; opacity:0.6; cursor:pointer; font-weight:bold;" id="t_clearBtn" onclick="clearSearchField()">지우기</span>
      </div>
      <div style="display:flex; gap:10px;">
        <input type="text" id="searchInput" class="neu-input" placeholder="음식명 검색" onkeydown="if(event.key === 'Enter') execApiSearch()">
        <button class="sm-btn primary" style="padding: 0 16px; border-radius: 14px;" id="t_searchBtn" onclick="execApiSearch()"><span class="icon-search"></span>검색</button>
      </div>
      <div class="search-results-list" id="searchResults">
        <div style="font-size:12px; opacity:0.5; padding:15px; text-align:center;" id="t_searchPlaceholder">검색어를 입력 후 검색 버튼을 누르시면 실시간 영양 정보가 노출됩니다.</div>
      </div>
    </div>

    <!-- 로컬 라이징 푸드 카테고리/명칭 시스템 -->
    <div class="input-grid" style="align-items: flex-end;">
      <div class="input-group" style="flex: 1;"><label class="label" id="t_lblCat">음식항목 선택</label><select id="cat" class="neu-input" onchange="onCatSelect()"></select></div>
      <div class="input-group" style="flex: 1.2;"><label class="label" id="t_lblFood">음식명</label><select id="food" class="neu-input"></select></div>
      <div class="input-group" style="flex: 0.5;"><label class="label" id="t_lblQty1">수량(x)</label><input type="number" id="foodQty" class="neu-input" value="1" min="0.1" step="0.1"></div>
      <button class="neu-btn" style="flex: 0.4; padding: 13px; margin: 0; font-size: 13px; height: 45px; border-radius: 14px; background:var(--accent-emerald); color:white;" id="t_addBtn1" onclick="onFoodAdd()">추가</button>
    </div>

    <!-- 직접 입력 영역 -->
    <div class="input-grid" style="align-items: flex-end;">
      <div class="input-group" style="flex: 1.5;"><label class="label" id="t_lblCustomName">직접입력(음식명)</label><input type="text" id="customFood" class="neu-input" placeholder="음식명"></div>
      <div class="input-group"><label class="label" id="t_lblCustomKcal">칼로리(kcal)</label><input type="number" id="customKcal" class="neu-input" placeholder="kcal"></div>
      <div class="input-group" style="flex: 0.5;"><label class="label" id="t_lblQty2">수량(x)</label><input type="number" id="customQty" class="neu-input" value="1" min="0.1" step="0.1"></div>
      <button class="neu-btn" style="flex: 0.4; padding: 13px; margin: 0; font-size: 13px; height: 45px; border-radius: 14px; background:var(--accent-emerald); color:white;" id="t_addBtn2" onclick="onCustomFoodAdd()">추가</button>
    </div>

    <div id="foodList" style="margin-top: 20px;"></div>
    
    <div style="text-align:right; font-weight:bold; margin-top:20px; color:var(--text); font-size: 17px;" id="t_totalIntakeBox">
      총 섭취: <span id="sumKcal" style="color:var(--accent); font-size:22px;">0</span> kcal
    </div>

    <button class="neu-btn" style="background: linear-gradient(90deg, #16a34a, #34C759); color: white; margin-top: 15px; border-radius: 15px; margin-bottom: 15px;" id="t_logAddBtn" onclick="saveCurrentMealLog()">➕ 식사 기록 추가하기</button>
    
    <button id="timelineBtn" class="neu-btn" style="color: var(--accent); margin-bottom: 5px;" onclick="toggleTimeline()">누적 식사 일기 타임라인 로그 보기 🗂️</button>
    <div id="timelineSec" class="toggle-section">
      <div id="timelineLogs" style="padding: 5px 0;">
        <div style="text-align: center; opacity: 0.5; padding: 20px 10px; font-size: 14px;" id="t_logPlaceholder">저장된 식사 일기 기록이 없습니다.</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" id="t_secTitle3" style="background:#FF9500;">감량 목표 설정</div>
    <div class="input-grid">
      <div class="input-group"><label class="label" id="t_lblTargetW">목표 체중(Kg)</label><input type="number" id="tw" class="neu-input" placeholder="65" oninput="updateStatus()"></div>
      <div class="input-grid-group" style="display:flex; flex:1; gap:12px;">
        <div class="input-group"><label class="label" id="t_lblCalStatus">칼로리상태</label><input type="number" id="calStatus" class="neu-input" readonly style="color:var(--accent); font-weight:800;"></div>
      </div>
    </div>
    <div id="goalSum" class="result-text" style="margin-top:10px; font-weight: 600;"></div>
  </div>

  <button id="mapBtn" class="neu-btn" onclick="toggleMap()">나의 감량 로드맵 산출 보기 🗺️</button>
  <div style="font-size:11px; margin-bottom:20px; opacity:0.8; text-align:center;" id="t_mapTip">위 버튼을 클릭하면 실시간 로드맵이 생성됩니다.</div> 
  <div id="mapSec" class="toggle-section">
    <div class="card">
      <div class="table-container" id="mapRes">정보를 모두 입력하면 로드맵이 생성됩니다.</div>
    </div>
  </div>
</div>

<!-- 커스텀 다국어 달력 모달 레이어 -->
<div id="customCalModal" class="custom-cal-modal" onclick="closeCustomCalendar(event)">
  <div class="cal-box" onclick="event.stopPropagation()">
    <div class="cal-nav-header">
      <div class="cal-title-text" id="calTitleYearMonth" onclick="setCalToToday()">2026년 07월</div>
      <div class="cal-arrows">
        <span class="cal-arrow-btn" onclick="moveCalendarMonth(-1)">↑</span>
        <span class="cal-arrow-btn" onclick="moveCalendarMonth(1)">↓</span>
      </div>
    </div>
    <div class="cal-week-grid" id="calWeekGrid"></div>
    <div class="cal-days-grid" id="calDaysGrid"></div>

/* --- [요청 사항 반영] 다른 계정 로그인 시 초기화 및 로컬 데이터 갱신 제어 모듈 --- */
function handleUserAccountSession() {
  // 실제 다른 계정 식별 키 혹은 토큰이 세션이나 변수로 유입되는 가상 트리거를 모방합니다.
  // 여기서는 다른 계정으로 연동 실행 시 다른 키의 스토리지 세션이 되도록 제어 가능하며,
  // 변경점이 발견될 시 기존 캐시 데이터를 클리어하고 직접 입력 푸드 목록을 클린 리셋 및 강제 갱신합니다.
  const currentAccountKey = "user_default_account"; 
  const lastAccountKey = localStorage.getItem('last_logged_account');
  
  if (lastAccountKey && lastAccountKey !== currentAccountKey) {
    // 다른 계정으로 감지되었으므로, 이전 사용자의 직접 입력 음식과 임시 데이터를 전체 리셋(초기화)합니다.
    localStorage.removeItem('localCustomFoodDb_ko');
    localStorage.removeItem('localCustomFoodDb_en');
    localStorage.removeItem('localCustomFoodDb_jp');
    localStorage.removeItem('localCustomFoodDb_zh');
    localStorage.removeItem('dietMealLogs');
  }
  localStorage.setItem('last_logged_account', currentAccountKey);
}

function getCustomDbFromStorage() {
  const data = localStorage.getItem('localCustomFoodDb_' + currentLang);
  return data ? JSON.parse(data) : {};
}

function saveCustomDbToStorage(name, kcal) {
  let currentDb = getCustomDbFromStorage();
  currentDb[name] = Math.round(kcal);
  localStorage.setItem('localCustomFoodDb_' + currentLang, JSON.stringify(currentDb));
  /* --- [요청 사항 반영] 직접 입력 데이터가 세션 변동 등으로 변경될 때 UI 셀렉트박스를 즉시 갱신 --- */
  initCategories(); 
}

function initCategories() {
  const catSel = document.getElementById('cat'); 
  const currentSelectedValue = catSel.value;
  catSel.innerHTML = '';
  
  const targetedDb = foodDbMaster[currentLang];
  Object.keys(targetedDb).forEach(c => { 
    let opt = document.createElement('option'); opt.value = c; opt.innerText = c; catSel.appendChild(opt); 
  });
  
  const customDb = getCustomDbFromStorage();
  if (Object.keys(customDb).length > 0) {
    let opt = document.createElement('option'); opt.value = "직접 입력한 음식"; opt.innerText = i18n[currentLang].customCategoryTag;
    catSel.appendChild(opt);
  }
  
  if (currentSelectedValue && [...catSel.options].some(o => o.value === currentSelectedValue)) {
    catSel.value = currentSelectedValue;
  }
  onCatSelect();
}

function onCatSelect() {
  const cat = document.getElementById('cat').value, fSel = document.getElementById('food');
  fSel.innerHTML = '';
  
  if (cat === "직접 입력한 음식") {
    const customDb = getCustomDbFromStorage();
    Object.keys(customDb).forEach(n => {
      let opt = document.createElement('option'); opt.value = n; opt.innerText = `${n} (${customDb[n]}kcal)`; fSel.appendChild(opt);
    });
  } else if (foodDbMaster[currentLang][cat]) {
    const section = foodDbMaster[currentLang][cat];
    Object.keys(section).forEach(n => { 
      let opt = document.createElement('option'); opt.value = n; opt.innerText = `${n} (${section[n]}kcal)`; fSel.appendChild(opt); 
    });
  }
}

function openCustomCalendar() {
  document.getElementById('customCalModal').style.display = 'flex';
  renderCalendarGrid();
}

function closeCustomCalendar(e) {
  document.getElementById('customCalModal').style.display = 'none';
}

function setCalDateInputValue(dateObj) {
  if(!dateObj) {
    document.getElementById('uiDate').value = "";
    return;
  }
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  
  if(currentLang === 'ko') document.getElementById('uiDate').value = `${y}-${m}-${d}`;
  else if(currentLang === 'zh') document.getElementById('uiDate').value = `${y}/${m}/${d}`;
  else if(currentLang === 'jp') document.getElementById('uiDate').value = `${y}年${m}月${d}日`;
  else document.getElementById('uiDate').value = `${m}/${d}/${y}`;
}

function renderCalendarGrid() {
  const pack = i18n[currentLang];
  const displayMonth = String(calCurrentMonth + 1).padStart(2, '0');
  if(currentLang === 'en') {
    const monthsEng = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    document.getElementById('calTitleYearMonth').innerText = `${monthsEng[calCurrentMonth]} ${calCurrentYear}`;
  } else {
    document.getElementById('calTitleYearMonth').innerText = `${calCurrentYear}${pack.calYearSuffix}${displayMonth}${pack.calMonthSuffix}`;
  }
  
  const weekGrid = document.getElementById('calWeekGrid');
  weekGrid.innerHTML = "";
  pack.calWeeks.forEach(w => { weekGrid.innerHTML += `<div>${w}</div>`; });
  
  const daysGrid = document.getElementById('calDaysGrid');
  daysGrid.innerHTML = "";
  
  const firstDayIndex = new Date(calCurrentYear, calCurrentMonth, 1).getDay();
  const lastDate = new Date(calCurrentYear, calCurrentMonth + 1, 0).getDate();
  const prevLastDate = new Date(calCurrentYear, calCurrentMonth, 0).getDate();
  
  for(let i = firstDayIndex; i > 0; i--) {
    daysGrid.innerHTML += `<div class="cal-day-cell other-month">${prevLastDate - i + 1}</div>`;
  }
  
  const today = new Date();
  for(let d = 1; d <= lastDate; d++) {
    let classes = "cal-day-cell";
    if(today.getFullYear() === calCurrentYear && today.getMonth() === calCurrentMonth && today.getDate() === d) classes += " today-active";
    if(calSelectedDate && calSelectedDate.getFullYear() === calCurrentYear && calSelectedDate.getMonth() === calCurrentMonth && calSelectedDate.getDate() === d) classes += " selected-active";
    
    daysGrid.innerHTML += `<div class="${classes}" onclick="selectCalendarDate(${d})">${d}</div>`;
  }
  
  const totalCells = firstDayIndex + lastDate;
  const nextPadding = (7 - (totalCells % 7)) % 7;
  for(let n = 1; n <= nextPadding; n++) {
    daysGrid.innerHTML += `<div class="cal-day-cell other-month">${n}</div>`;
  }
}

function moveCalendarMonth(dir) {
  calCurrentMonth += dir;
  if(calCurrentMonth > 11) { calCurrentMonth = 0; calCurrentYear++; }
  if(calCurrentMonth < 0) { calCurrentMonth = 11; calCurrentYear--; }
  renderCalendarGrid();
}

function selectCalendarDate(day) {
  calSelectedDate = new Date(calCurrentYear, calCurrentMonth, day);
  setCalDateInputValue(calSelectedDate);
  closeCustomCalendar();
}

function clearCalSelection() {
  calSelectedDate = null;
  document.getElementById('uiDate').value = "";
  closeCustomCalendar();
}

function setCalToToday() {
  calSelectedDate = new Date();
  calCurrentYear = calSelectedDate.getFullYear();
  calCurrentMonth = calSelectedDate.getMonth();
  setCalDateInputValue(calSelectedDate);
  closeCustomCalendar();
}

  const pack = i18n[currentLang];

  resContainer.innerHTML = `<div style="font-size:13px; opacity:0.7; padding:20px; text-align:center;"><span class="icon-sparkles"></span>Searching Food DB...</div>`;
  try {
    const apiUrl = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20`;
    const response = await fetch(apiUrl); const data = await response.json();
    if (!data.products || data.products.length === 0) { resContainer.innerHTML = `<div style="font-size:12px; opacity:0.5; padding:15px; text-align:center;">No results found.</div>`; return; }
    let html = ""; let validItemCount = 0;
    data.products.forEach(product => {
      let brand = product.brands ? product.brands.split(',')[0].trim() : "";
      let productName = product.product_name_ko || product.product_name || "Unknown Food";
      if(brand) productName = `[${brand}] ${productName}`;
      let energyKcal = 0; let servingInfo = "100g";
      if (product.nutriments) {
        if (product.nutriments['energy-kcal_serving']) { energyKcal = parseFloat(product.nutriments['energy-kcal_serving']); servingInfo = product.serving_size ? `${product.serving_size}` : "1 Serving"; }
        else if (product.nutriments['energy-kcal_value']) { energyKcal = parseFloat(product.nutriments['energy-kcal_value']); servingInfo = "100g"; }
        else if (product.nutriments['energy-kcal_100g']) { energyKcal = parseFloat(product.nutriments['energy-kcal_100g']); servingInfo = "100g"; }
        energyKcal = Math.round(energyKcal);
      }
      if (energyKcal > 0) {
        validItemCount++; const safeName = productName.replace(/'/g, "\\'").replace(/"/g, '\\"');
        html += `<div class="search-item"><div class="search-item-info"><div><b>${productName}</b></div><div class="search-item-cal"><span class="icon-sparkles"></span>${servingInfo} ${pack.servingText} · <span style="color:var(--accent-emerald); font-weight:bold;">${energyKcal} kcal</span></div></div><div class="search-item-btns"><button class="sm-btn" onclick="triggerSelectToForm('${safeName}', ${energyKcal})">${pack.selectText}</button><button class="sm-btn primary" onclick="triggerDirectAdd('${safeName}', ${energyKcal})">${pack.directAddText}</button></div></div>`;
      }
    });
    resContainer.innerHTML = validItemCount === 0 ? `<div style="font-size:12px; opacity:0.5; padding:15px; text-align:center;">No calorie info found.</div>` : html;
  } catch (error) { console.error(error); resContainer.innerHTML = `<div style="font-size:12px; color:#ff5252; padding:15px; text-align:center;">Network Error.</div>`; }
}

function triggerSelectToForm(name, kcal) {
  document.getElementById('customFood').value = name; document.getElementById('customKcal').value = kcal; document.getElementById('customQty').value = 1;
}
function triggerDirectAdd(name, kcal) { selectedFoods.push({ name: name, kcal: parseFloat(kcal), qty: 1 }); drawFoods(); }
function clearSearchField() { document.getElementById('searchInput').value = ""; document.getElementById('searchResults').innerText = i18n[currentLang].searchDefaultMsg; }
function changeMode(mode) {
  const b = document.body; const l = document.getElementById('lBtn'); const d = document.getElementById('dBtn');
  if(mode === 'dark') { b.classList.add('dark'); d.classList.add('active'); l.classList.remove('active'); localStorage.setItem('theme', 'dark'); }
  else { b.classList.remove('dark'); l.classList.add('active'); d.classList.remove('active'); localStorage.setItem('theme', 'light'); }
}

function calculateMetricsLocally(p) {
  const { height, weight, age, activityLevel, exerciseTime } = p;
  let bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
  const activityFactors = { "1": 0.1, "2": 0.15, "3": 0.25, "4": 0.35, "5": 0.45, "6": 0.6, "7": 0.8 };
  const metBase = { "1": 2.5, "2": 3.0, "3": 4.0, "4": 5.0, "5": 6.5, "6": 8.0, "7": 10.0 };
  const exerciseCal = ( (exerciseTime / 60) * metBase[activityLevel] * weight );
  const activityCal = Math.round((bmr * activityFactors[activityLevel]) + exerciseCal);
  const tdee = Math.round(bmr + 400 + activityCal); const bmi = (weight / ((height/100)**2)).toFixed(1);
  let status = "Normal", color = "#2ecc71";
  if (bmi < 18.5) { status = "Underweight"; color = "#3498db"; }
  else if (bmi >= 23 && bmi < 25) { status = "Overweight"; color = "#f39c12"; }
  else if (bmi >= 25 && bmi < 30) { status = "Obese"; color = "#e74c3c"; }
  else if (bmi >= 30) { status = "Severely Obese"; color = "#c0392b"; }
  return { bmi, status, color, bmr: Math.round(bmr), activityCal: Math.round(activityCal), tdee };
}

function runTDEE() {
  const h = document.getElementById('h').value, w = document.getElementById('w').value, a = document.getElementById('a').value;
  const resBox = document.getElementById('tdeeRes'); if(!h || !w || !a) { resBox.innerText = i18n[currentLang].msgInputAll; return; }
  const res = calculateMetricsLocally({ height: parseFloat(h), weight: parseFloat(w), age: parseInt(a), activityLevel: document.getElementById('lvl').value, exerciseTime: parseFloat(document.getElementById('exMin').value || 0) });
  tdeeVal = res.tdee;
  if (currentLang === "ko") {
    resBox.innerHTML = `1. BMI: <b style="color:${res.color}">${res.bmi} (${res.status})</b><br>2. 기초대사량: <b>${res.bmr}</b> kcal<br>3. 일상활동대사량: <b>400</b> kcal<br>4. 활동대사량: <b>${res.activityCal}</b> kcal<br>5. 총활동대사량: <b style="color:var(--accent); font-size:18px;">${res.tdee} kcal</b>`;
  } else {
    resBox.innerHTML = `1. BMI: <b style="color:${res.color}">${res.bmi} (${res.status})</b><br>2. BMR: <b>${res.bmr}</b> kcal<br>3. Daily Activity: <b>400</b> kcal<br>4. Exercise Energy: <b>${res.activityCal}</b> kcal<br>5. TDEE: <b style="color:var(--accent); font-size:18px;">${res.tdee} kcal</b>`;
  }
  updateStatus();
}

function toggleTDEE() { const s = document.getElementById('tdeeSec'); s.classList.toggle('show'); updateButtonLabels(); if(s.classList.contains('show')) runTDEE(); }
function onFoodAdd() {
  const cat = document.getElementById('cat').value, name = document.getElementById('food').value;
  const qty = parseFloat(document.getElementById('foodQty').value) || 1; if(!name) return;
  let targetKcal = 0;
  if (cat === "직접 입력한 음식" || cat === i18n["en"].customCategoryTag || cat === i18n["jp"].customCategoryTag || cat === i18n["zh"].customCategoryTag) { targetKcal = parseFloat(getCustomDbFromStorage()[name]); }
  else { targetKcal = parseFloat(foodDbMaster[currentLang][cat][name]); }
  selectedFoods.push({ name: name, kcal: targetKcal, qty: qty }); drawFoods();
}

/* --- [요청 사항 반영] 직접 입력 음식 리스트 실시간 동적 갱신 모듈 플러그인 --- */
function onCustomFoodAdd() {
  const nIn = document.getElementById('customFood'), kIn = document.getElementById('customKcal'), qIn = document.getElementById('customQty');
  const name = nIn.value.trim(), kcal = parseFloat(kIn.value), qty = parseFloat(qIn.value) || 1; if(!name || isNaN(kcal)) return;
  
  saveCustomDbToStorage(name, kcal); 
  selectedFoods.push({ name: name, kcal: kcal, qty: qty });
  
  nIn.value = ""; kIn.value = ""; qIn.value = "1"; 
  drawFoods();
}

function drawFoods() {
  const box = document.getElementById('foodList'); box.innerHTML = ""; let total = 0;
  selectedFoods.forEach((it, i) => {
    total += it.kcal * it.qty;
    box.innerHTML += `<div class="food-row"><div style="flex:1;"><b>${it.name}</b> <span style="font-size:11px; opacity:0.7;">(${Math.round(it.kcal * it.qty)}kcal)</span></div><div style="display:flex; align-items:center;"><input type="number" class="neu-input" style="width:55px; padding:6px; text-align:center;" value="${it.qty}" step="0.1" onchange="editQty(${i}, this.value)"><span style="font-size:12px; margin-left:5px;">${i18n[currentLang].timesText}</span><span class="cancel-btn" onclick="removeFood(${i})">X</span></div></div>`;
  });
  document.getElementById('sumKcal').innerText = Math.round(total); updateStatus();
}
function editQty(i, v) { selectedFoods[i].qty = parseFloat(v) || 0; drawFoods(); }
function removeFood(i) { selectedFoods.splice(i, 1); drawFoods(); }

function updateStatus() {
  const intake = parseFloat(document.getElementById('sumKcal').innerText) || 0; const diff = tdeeVal - intake;
  document.getElementById('calStatus').value = Math.round(diff);
  const cw = parseFloat(document.getElementById('w').value), tw = parseFloat(document.getElementById('tw').value);
  const goalBox = document.getElementById('goalSum'), summaryBox = document.getElementById('hello-summary'), pack = i18n[currentLang];
  document.getElementById('t_totalIntakeBox').innerHTML = pack.totalIntake + `<span id="sumKcal" style="color:var(--accent); font-size:22px;">${Math.round(intake)}</span> kcal`;
  if (!cw || !tw || !tdeeVal) { goalBox.innerHTML = `<span style='color: #e74c3c; font-weight: bold;'>${pack.msgFillAll}</span>`; summaryBox.innerText = pack.infoRequired; return; }
  const lose = (cw - tw).toFixed(1); const days = diff > 0 ? Math.round((lose * 7700) / diff) : 0;
  let html = "";
  if(currentLang === "ko") {
    html += `감량 목표: ${lose}kg<br>일일 소모 차이: ${Math.round(diff)}kcal<br>예상 달성 일수: ${days}일`;
    if (diff <= 0) html += `<br><span style="color: #e74c3c; font-weight: bold;">칼로리 차이를 플러스(+)로 만드세요.</span>`;
  } else {
    html += `Weight to Lose: ${lose}kg<br>Daily Calorie Deficit: ${Math.round(diff)}kcal<br>Estimated Days: ${days} Days`;
    if (diff <= 0) html += `<br><span style="color: #e74c3c; font-weight: bold;">Make the calorie difference positive (+).</span>`;
  }
  goalBox.innerHTML = html;
  if(currentLang === "ko") summaryBox.innerText = `목표:${lose}kg 감량, 예상:${days > 0 ? days + '일' : '-'} 🔥`;
  else if(currentLang === "en") summaryBox.innerText = `Goal:-${lose}kg, Est:${days > 0 ? days + ' days' : '-'} 🔥`;
  else if(currentLang === "jp") summaryBox.innerText = `目標:-${lose}kg, 予想:${days > 0 ? days + '日' : '-'} 🔥`;
  else summaryBox.innerText = `目标:-${lose}kg, 预计:${days > 0 ? days + '天' : '-'} 🔥`;
}

function saveCurrentMealLog() {
  const dateStr = document.getElementById('uiDate').value; const timeStr = document.getElementById('mealTime').value;
  const totalKcal = document.getElementById('sumKcal').innerText; if (selectedFoods.length === 0 || !dateStr) return;
  const foodsSummary = selectedFoods.map(f => `${f.name}(x${f.qty})`).join(', ');
  const logItem = { id: Date.now(), date: dateStr, time: timeStr, summary: foodsSummary, kcal: totalKcal };
  savedMealLogs.unshift(logItem); localStorage.setItem('dietMealLogs', JSON.stringify(savedMealLogs));
  selectedFoods = []; drawFoods(); renderTimelineLogs();
  if(!document.getElementById('timelineSec').classList.contains('show')) toggleTimeline();
}
function loadMealLogs() { const stored = localStorage.getItem('dietMealLogs'); if (stored) savedMealLogs = JSON.parse(stored); renderTimelineLogs(); }
function toggleTimeline() { document.getElementById('timelineSec').classList.toggle('show'); updateButtonLabels(); }
function deleteMealLog(id) { savedMealLogs = savedMealLogs.filter(item => item.id !== id); localStorage.setItem('dietMealLogs', JSON.stringify(savedMealLogs)); renderTimelineLogs(); }

function renderTimelineLogs() {
  const box = document.getElementById('timelineLogs'), pack = i18n[currentLang];
  if (savedMealLogs.length === 0) { box.innerHTML = `<div style="text-align: center; opacity: 0.5; padding: 20px 10px; font-size: 14px;">${pack.logPlaceholder}</div>`; return; }
  let html = "";
  savedMealLogs.forEach(log => {
    html += `
      <div class="log-card">
        <div class="log-header">
          <span>📅 ${log.date}</span>
          <div class="log-header-right">
            <span class="log-tag">${log.time}</span>
            <button class="log-delete-icon-btn" onclick="deleteMealLog(${log.id})" title="Delete">
              <svg viewBox="0 0 24 24">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="log-content">${log.summary}</div>
        <div class="log-kcal">❯ ${log.kcal} kcal</div>
      </div>
    `;
  });
  box.innerHTML = html;
}

function runMap() {
  const cw = parseFloat(document.getElementById('w').value), gw = parseFloat(document.getElementById('tw').value), st = parseFloat(document.getElementById('calStatus').value);
  const box = document.getElementById('mapRes'), pack = i18n[currentLang];
  if(!cw || !gw) { box.innerText = pack.msgFillAll; return; }
  if(cw <= gw) { box.innerHTML = `<b style='color:#ff5252;'>${pack.msgTargetLow}</b>`; return; }
  if(st <= 50) { box.innerText = pack.msgDeficitLow; return; }
  let list = []; let tempWeight = cw;
  while (tempWeight > gw && list.length < 15) {
    let nextWeight = Math.max(gw, tempWeight - 1); let cumulativeDays = Math.round(((cw - nextWeight) * 7700) / st);
    let period = cumulativeDays - (list.length > 0 ? list[list.length-1].cumVal : 0);
    let suffix = currentLang === "ko" ? "일" : (currentLang === "zh" ? "天" : " Days");
    list.push({ target: nextWeight.toFixed(1) + "kg", period: period + suffix, cumulative: cumulativeDays + suffix, cumVal: cumulativeDays }); tempWeight = nextWeight;
  }
  let prefixText = currentLang === "ko" ? "총 예상 소요일: " : "Total Estimated Period: ";
  let h = `<b>${prefixText} ${list[list.length-1].cumulative}</b><br><table><tr><th>${pack.mapHeaders[0]}</th><th>${pack.mapHeaders[1]}</th><th>${pack.mapHeaders[2]}</th></tr>`;
  list.forEach(r => { h += `<tr><td>${r.target}</td><td>${r.period}</td><td>${r.cumulative}</td></tr>`; });
  box.innerHTML = h + "</table>";
}
function toggleMap() { const s = document.getElementById('mapSec'); s.classList.toggle('show'); updateButtonLabels(); if(s.classList.contains('show')) runMap(); }
</script>
